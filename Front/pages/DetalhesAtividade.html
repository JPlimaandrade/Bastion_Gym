<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Atividade - Bastion GYM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/styles.css">
    <link rel="stylesheet" href="../src/css/treino-detalhes.css">
    <style>
        .read-only-badge {
            background: var(--success-color);
            color: var(--text-color);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .activity-summary {
            background: var(--background-card);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: var(--border-radius);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .activity-summary h2 {
            color: var(--text-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .activity-summary h2 i {
            color: var(--primary-color);
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        
        .summary-item {
            background: var(--secondary-light);
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
        }
        
        .summary-item i {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .summary-item h4 {
            color: var(--text-color);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .summary-item p {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        
        .exercise-card {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        
        .series-item input,
        .series-item select {
            background: var(--background-dark);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        
        .add-series-btn,
        .remove-series-btn {
            display: none !important;
        }
        
        .complete-exercise-btn {
            background: var(--success-color);
            cursor: default;
        }
        
        .complete-exercise-btn:hover {
            transform: none;
            box-shadow: none;
        }
        
        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
