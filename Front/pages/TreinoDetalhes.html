<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino - Bastion GYM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/styles.css">
    <link rel="stylesheet" href="../src/css/treino-detalhes.css">
    <script src="../src/js/common.js"></script>
    <script src="../src/js/treino-detalhes.js"></script>
</head>
<body>
    <div class="home-container">
        <div class="workout-detail-container">
            <div class="workout-detail-header">
                <h1>Força Completa <span>- Treino do Dia</span></h1>
                <button class="back-btn" onclick="window.location.href='Treinos.html'">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
            
            <div class="exercise-list">
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h3>
                            <span class="exercise-number">1</span>
                            Supino Reto
                        </h3>
                        <button class="complete-exercise-btn" onclick="completeExercise(this)">
                            <i class="fas fa-check"></i> Concluir
                        </button>
                    </div>
                    
                    <div class="series-container">
                        <div class="series-item">
                            <div class="series-number">1</div>
                            <div class="series-input-group">
                                <label>Peso (kg)</label>
                                <input type="number" class="series-input" placeholder="0" value="60">
                            </div>
                            <div class="series-input-group">
                                <label>Repetições</label>
                                <input type="number" class="series-input" placeholder="0" value="12">
                            </div>
                            <div class="series-input-group">
                                <label>Descanso</label>
                                <select class="series-select">
                                    <option value="0">0s</option>
                                    <option value="30">30s</option>
                                    <option value="60">1min</option>
                                    <option value="90">1min 30s</option>
                                    <option value="120" selected>2min</option>
                                    <option value="150">2min 30s</option>
                                    <option value="180">3min</option>
                                    <option value="210">3min 30s</option>
                                    <option value="240">4min</option>
                                    <option value="270">4min 30s</option>
                                    <option value="300">5min</option>
                                </select>
                            </div>
                            <div class="series-buttons">
                                <button class="add-series-btn" onclick="addSeries(this)">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <button class="remove-series-btn" onclick="removeSeries(this)" style="display: none;">
                                    <i class="fas fa-minus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h3>
                            <span class="exercise-number">2</span>
                            Agachamento
                        </h3>
                        <button class="complete-exercise-btn" onclick="completeExercise(this)">
                            <i class="fas fa-check"></i> Concluir
                        </button>
                    </div>
                    
                    <div class="series-container">
                        <div class="series-item">
                            <div class="series-number">1</div>
                            <div class="series-input-group">
                                <label>Peso (kg)</label>
                                <input type="number" class="series-input" placeholder="0" value="80">
                            </div>
                            <div class="series-input-group">
                                <label>Repetições</label>
                                <input type="number" class="series-input" placeholder="0" value="10">
                            </div>
                            <div class="series-input-group">
                                <label>Descanso</label>
                                <select class="series-select">
                                    <option value="0">0s</option>
                                    <option value="30">30s</option>
                                    <option value="60">1min</option>
                                    <option value="90">1min 30s</option>
                                    <option value="120">2min</option>
                                    <option value="150">2min 30s</option>
                                    <option value="180" selected>3min</option>
                                    <option value="210">3min 30s</option>
                                    <option value="240">4min</option>
                                    <option value="270">4min 30s</option>
                                    <option value="300">5min</option>
                                </select>
                            </div>
                            <div class="series-buttons">
                                <button class="add-series-btn" onclick="addSeries(this)">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <button class="remove-series-btn" onclick="removeSeries(this)" style="display: none;">
                                    <i class="fas fa-minus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h3>
                            <span class="exercise-number">3</span>
                            Desenvolvimento Militar
                        </h3>
                        <button class="complete-exercise-btn" onclick="completeExercise(this)">
                            <i class="fas fa-check"></i> Concluir
                        </button>
                    </div>
                    
                    <div class="series-container">
                        <div class="series-item">
                            <div class="series-number">1</div>
                            <div class="series-input-group">
                                <label>Peso (kg)</label>
                                <input type="number" class="series-input" placeholder="0" value="40">
                            </div>
                            <div class="series-input-group">
                                <label>Repetições</label>
                                <input type="number" class="series-input" placeholder="0" value="12">
                            </div>
                            <div class="series-input-group">
                                <label>Descanso</label>
                                <select class="series-select">
                                    <option value="0">0s</option>
                                    <option value="30">30s</option>
                                    <option value="60">1min</option>
                                    <option value="90">1min 30s</option>
                                    <option value="120" selected>2min</option>
                                    <option value="150">2min 30s</option>
                                    <option value="180">3min</option>
                                    <option value="210">3min 30s</option>
                                    <option value="240">4min</option>
                                    <option value="270">4min 30s</option>
                                    <option value="300">5min</option>
                                </select>
                            </div>
                            <div class="series-buttons">
                                <button class="add-series-btn" onclick="addSeries(this)">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <button class="remove-series-btn" onclick="removeSeries(this)" style="display: none;">
                                    <i class="fas fa-minus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h3>
                            <span class="exercise-number">4</span>
                            Remada Curvada
                        </h3>
                        <button class="complete-exercise-btn" onclick="completeExercise(this)">
                            <i class="fas fa-check"></i> Concluir
                        </button>
                    </div>
                    
                    <div class="series-container">
                        <div class="series-item">
                            <div class="series-number">1</div>
                            <div class="series-input-group">
                                <label>Peso (kg)</label>
                                <input type="number" class="series-input" placeholder="0" value="50">
                            </div>
                            <div class="series-input-group">
                                <label>Repetições</label>
                                <input type="number" class="series-input" placeholder="0" value="12">
                            </div>
                            <div class="series-input-group">
                                <label>Descanso</label>
                                <select class="series-select">
                                    <option value="0">0s</option>
                                    <option value="30">30s</option>
                                    <option value="60">1min</option>
                                    <option value="90">1min 30s</option>
                                    <option value="120">2min</option>
                                    <option value="150">2min 30s</option>
                                    <option value="180" selected>3min</option>
                                    <option value="210">3min 30s</option>
                                    <option value="240">4min</option>
                                    <option value="270">4min 30s</option>
                                    <option value="300">5min</option>
                                </select>
                            </div>
                            <div class="series-buttons">
                                <button class="add-series-btn" onclick="addSeries(this)">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <button class="remove-series-btn" onclick="removeSeries(this)" style="display: none;">
                                    <i class="fas fa-minus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button class="add-exercise-btn" onclick="window.location.href='AdicionarExercicio.html'">
                    <i class="fas fa-plus"></i>
                    Adicionar Exercício
                </button>
            </div>
            
            <div class="workout-actions">
                <button class="finish-workout-btn" onclick="finishWorkout()">
                    <i class="fas fa-flag-checkered"></i>
                    Finalizar Treino
                </button>
            </div>
        </div>
        
        <footer class="home-footer">
            <img src="../src/img/logo/logo_fundo_transparente.png" alt="Bastion GYM Logo" class="footer-logo">
            <p>&copy; 2024 Bastion GYM. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>
</html>
