<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bastion GYM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/styles.css">
    <script src="../src/js/common.js"></script>
    <script src="../src/js/auth.js"></script>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-image" style="background-image: url('https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=800&q=80');"></div>
            
            <div class="auth-content">
                <div class="auth-card">
                    <div class="logo-container">
                        <img src="../src/img/logo/logo_fundo_transparente.png" alt="Bastion GYM Logo">
                        <h1>Bastion <span>GYM</span></h1>
                    </div>
                    
                    <h2 class="auth-title">Crie sua conta</h2>
                    <p class="auth-subtitle">Junte-se ao Bastion GYM e transforme seu corpo</p>
                    
                    <form id="cadastroForm">
                        <div class="form-group">
                            <label for="nome">Nome completo</label>
                            <input 
                                type="text" 
                                id="nome" 
                                name="nome" 
                                placeholder="Seu nome completo"
                                required
                            >
                            <span class="error-message">Por favor, insira seu nome completo</span>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="seu@email.com"
                                required
                            >
                            <span class="error-message">Por favor, insira um e-mail válido</span>
                        </div>
                        
                        <div class="form-group password-group">
                            <label for="password">Senha</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('password')" aria-label="Mostrar senha">
                                <i class="fas fa-eye"></i>
                            </button>
                            <span class="error-message">A senha deve ter pelo menos 6 caracteres</span>
                        </div>
                        
                        <div class="form-group password-group">
                            <label for="confirmPassword">Confirmar senha</label>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')" aria-label="Mostrar senha">
                                <i class="fas fa-eye"></i>
                            </button>
                            <span class="error-message">As senhas não coincidem</span>
                        </div>
                        
                        <div class="form-group">
                            <label for="telefone">Telefone (opcional)</label>
                            <input 
                                type="tel" 
                                id="telefone" 
                                name="telefone" 
                                placeholder="(00) 00000-0000"
                            >
                        </div>
                        
                        <div class="remember-forgot">
                            <label>
                                <input type="checkbox" name="terms" required>
                                Concordo com os <a href="termos-de-uso.html" target="_blank"> termos de uso</a>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-user-plus"></i> Criar conta
                        </button>
                    </form>
                    
                    <div class="divider">
                        <span>ou cadastre-se com</span>
                    </div>
                    
                    <div class="social-login">
                        <button class="social-btn">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                    </div>
                    
                    <div class="auth-links">
                        <p>Já tem uma conta? <a href="Login.html">Faça login</a></p>
                        <p style="margin-top: 10px;"><a href="Home.html"><i class="fas fa-arrow-left"></i> Voltar para Home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
