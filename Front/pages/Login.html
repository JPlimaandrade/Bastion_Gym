<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bastion GYM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-image" style="background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800&q=80');"></div>
            
            <div class="auth-content">
                <div class="auth-card">
                    <div class="logo-container">
                        <img src="../src/img/logo/logo_fundo_transparente.png" alt="Bastion GYM Logo">
                        <h1>Bastion <span>GYM</span></h1>
                    </div>
                    
                    <h2 class="auth-title">Bem-vindo de volta!</h2>
                    <p class="auth-subtitle">Entre para continuar sua jornada fitness</p>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="seu@email.com"
                                required
                            >
                            <span class="error-message">Por favor, insira um e-mail válido</span>
                        </div>
                        
                        <div class="form-group password-group">
                            <label for="password">Senha</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                            <span class="error-message">A senha deve ter pelo menos 6 caracteres</span>
                        </div>
                        
                        <div class="remember-forgot">
                            <label>
                                <input type="checkbox" name="remember">
                                Lembrar-me
                            </label>
                            <a href="#">Esqueceu a senha?</a>
                        </div>
                        
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Entrar
                        </button>
                    </form>
                    
                    <div class="divider">
                        <span>ou continue com</span>
                    </div>
                    
                    <div class="social-login">
                        <button class="social-btn">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                        <button class="social-btn">
                            <i class="fab fa-github"></i>
                            GitHub
                        </button>
                    </div>
                    
                    <div class="auth-links">
                        <p>Ainda não tem uma conta? <a href="Cadastro.html">Cadastre-se</a></p>
                        <p style="margin-top: 10px;"><a href="Home.html"><i class="fas fa-arrow-left"></i> Voltar para Home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            let isValid = true;
            
            // Validação de e-mail
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value)) {
                email.classList.add('error');
                isValid = false;
            } else {
                email.classList.remove('error');
            }
            
            // Validação de senha
            if (password.value.length < 6) {
                password.classList.add('error');
                isValid = false;
            } else {
                password.classList.remove('error');
            }
            
            if (isValid) {
                // Aqui você adicionaria a lógica de login
                alert('Login realizado com sucesso! (Demo)');
                // window.location.href = 'Home.html';
            }
        });
        
        // Remover erro ao digitar
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                this.classList.remove('error');
            });
        });
    </script>
</body>
</html>
