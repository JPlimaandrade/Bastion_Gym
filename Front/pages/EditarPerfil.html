<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Bastion GYM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/styles.css">
    <link rel="stylesheet" href="../src/css/perfil-edit.css">
    <script src="../src/js/common.js"></script>
    <script src="../src/js/perfil-edit.js"></script>
</head>
<body>
    <div class="home-container">
        <div class="edit-profile-container">
            <div class="edit-profile-header">
                <h1>Editar Perfil</h1>
                <p>Atualize suas informações pessoais</p>
            </div>
            
            <form class="edit-profile-form" id="editProfileForm">
                <div class="avatar-upload">
                    <div class="avatar-preview">
                        <i class="fas fa-user"></i>
                    </div>
                    <button type="button" class="upload-btn">
                        <i class="fas fa-camera"></i> Alterar Foto
                    </button>
                </div>
                
                <div class="form-section">
                    <h3><i class="fas fa-user"></i> Informações Básicas</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" name="nome" value="João Silva">
                        </div>
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" value="joao.silva@email.com">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" value="(11) 98765-4321">
                        </div>
                        <div class="form-group">
                            <label for="nascimento">Data de Nascimento</label>
                            <input type="date" id="nascimento" name="nascimento" value="1996-05-15">
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3><i class="fas fa-heartbeat"></i> Informações Físicas</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="peso">Peso (kg)</label>
                            <input type="number" id="peso" name="peso" value="75" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="altura">Altura (m)</label>
                            <input type="number" id="altura" name="altura" value="1.78" step="0.01">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="objetivo">Objetivo</label>
                            <select id="objetivo" name="objetivo">
                                <option value="massa">Ganho de Massa</option>
                                <option value="emagrecimento">Emagrecimento</option>
                                <option value="definicao">Definição</option>
                                <option value="resistencia">Resistência</option>
                                <option value="saude">Saúde Geral</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="nivel">Nível de Experiência</label>
                            <select id="nivel" name="nivel">
                                <option value="iniciante">Iniciante</option>
                                <option value="intermediario">Intermediário</option>
                                <option value="avancado">Avançado</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3><i class="fas fa-lock"></i> Alterar Senha</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="senha-atual">Senha Atual</label>
                            <input type="password" id="senha-atual" name="senha-atual" placeholder="Deixe em branco para não alterar">
                        </div>
                        <div class="form-group">
                            <label for="nova-senha">Nova Senha</label>
                            <input type="password" id="nova-senha" name="nova-senha" placeholder="Mínimo 6 caracteres">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmar-senha">Confirmar Nova Senha</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme a nova senha">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="window.location.href='Perfil.html'">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
        
        <footer class="home-footer">
            <img src="../src/img/logo/logo_fundo_transparente.png" alt="Bastion GYM Logo" class="footer-logo">
            <p>&copy; 2024 Bastion GYM. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>
</html>
