<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Chat - Bastion GYM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        .ai-chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 70px);
            max-width: 100%;
            padding: 0;
        }
        
        .ai-chat-header {
            padding: 20px;
            background: var(--background-card);
            border-bottom: 1px solid rgba(249, 115, 22, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .ai-chat-header h2 {
            color: var(--text-color);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .ai-chat-header h2 i {
            color: var(--primary-color);
        }
        
        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
        }
        
        .ai-chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .ai-chat-message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }
        
        .ai-chat-message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        
        .ai-chat-message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .ai-chat-message.ai .ai-chat-message-avatar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        }
        
        .ai-chat-message.user .ai-chat-message-avatar {
            background: var(--secondary-light);
            border: 1px solid rgba(249, 115, 22, 0.3);
        }
        
        .ai-chat-message-content {
            background: var(--secondary-light);
            padding: 15px 18px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .ai-chat-message.ai .ai-chat-message-content {
            background: rgba(249, 115, 22, 0.1);
            border-color: rgba(249, 115, 22, 0.2);
        }
        
        .ai-chat-message-content p {
            color: var(--text-color);
            margin: 0;
            line-height: 1.5;
        }
        
        .ai-chat-input-area {
            padding: 20px;
            background: var(--background-card);
            border-top: 1px solid rgba(249, 115, 22, 0.2);
            display: flex;
            gap: 12px;
        }
        
        .ai-chat-input {
            flex: 1;
            padding: 15px 18px;
            background: var(--secondary-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }
        
        .ai-chat-input:focus {
            border-color: var(--primary-color);
        }
        
        .ai-chat-send-btn {
            padding: 15px 25px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--border-radius);
            color: var(--text-color);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .ai-chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body>
    <div class="home-container">
        <button class="back-btn" onclick="window.location.href='Home.html'" style="margin: 20px;">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>
        <div class="ai-chat-container">
            <div class="ai-chat-header">
                <h2><i class="fas fa-robot"></i> IA Fitness</h2>
                <div style="display: flex; align-items: center; gap: 8px; color: var(--success-color); font-size: 0.9rem;">
                    <div style="width: 8px; height: 8px; background: var(--success-color); border-radius: 50%;"></div>
                    <span>Online</span>
                </div>
            </div>
            
            <div class="ai-chat-messages">
                <div class="ai-chat-message ai">
                    <div class="ai-chat-message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="ai-chat-message-content">
                        <p>Olá! Sou sua IA Fitness do Bastion GYM. Como posso ajudar você hoje?</p>
                    </div>
                </div>
            </div>
            
            <div class="ai-chat-input-area">
                <input type="text" class="ai-chat-input" placeholder="Digite sua mensagem...">
                <button class="ai-chat-send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
